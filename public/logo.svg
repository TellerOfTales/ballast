<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 118 1454 840" role="img" aria-label="Ballast">
  <!-- Ballast mark: a rail-section U with flared caps, the wordmark, and a green half-disc.
       Drawn from the original artwork's proportions; the right side mirrors the left. -->
  <defs>
    <g id="side">
      <!-- top cap -->
      <path d="M62 132H256q6 0 9 6l15 32H86q-30 0-30-30q0-8 6-8z"/>
      <!-- flange the band hangs from -->
      <path d="M106 180H372l-34 31H200v8h-34q-12 0-16-8l-6-10H122q-16 0-16-14z"/>
    </g>
  </defs>
  <g fill="#e9a820">
    <use href="#side"/>
    <use href="#side" transform="translate(1534 0) scale(-1 1)"/>
  </g>
  <g fill="none" stroke="#e9a820" stroke-linecap="butt">
    <!-- outer band -->
    <path stroke-width="38" d="M175 205V330C175 702 470 921 767 921S1359 702 1359 330V205"/>
    <!-- inner band -->
    <path stroke-width="24" d="M231 214C231 652 478 878 767 878S1303 652 1303 214"/>
  </g>
  <text x="777" y="584" text-anchor="middle" textLength="975" lengthAdjust="spacingAndGlyphs"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="342" fill="#e9a820"
        stroke="#e9a820" stroke-width="9" stroke-linejoin="miter">BALLAST</text>
  <path fill="#179a48" d="M362 666H1172C1102 770 942 856 767 856S432 770 362 666Z"/>
</svg>
