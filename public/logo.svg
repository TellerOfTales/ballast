<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1000 610" role="img" aria-label="Ballast">
  <!-- Ballast mark, built geometrically so every line is clean and symmetric:
       both bands are arcs around one centre (500,200), so they stay parallel all the way round,
       and the caps on the right are the left caps mirrored about x=500. -->
  <defs>
    <g id="caps">
      <path d="M30 60H168l-10 20H38q-8 0-8-8z"/>
      <path d="M58 86H226l-18 18H66q-8 0-8-8z"/>
    </g>
  </defs>
  <g fill="#e9a820">
    <use href="#caps"/>
    <use href="#caps" transform="translate(1000 0) scale(-1 1)"/>
  </g>
  <g fill="none" stroke="#e9a820">
    <!-- outer band: radius 410 -->
    <path stroke-width="34" d="M90 104V200A410 410 0 0 0 910 200V104"/>
    <!-- inner band: radius 362 -->
    <path stroke-width="16" d="M138 104V200A362 362 0 0 0 862 200V104"/>
  </g>
  <text x="500" y="332" text-anchor="middle" textLength="640" lengthAdjust="spacingAndGlyphs"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="204"
        fill="#e9a820" stroke="#e9a820" stroke-width="5" stroke-linejoin="miter">BALLAST</text>
  <!-- green half-disc: radius 340 around the same centre, cut flat below the wordmark -->
  <path fill="#179a48" d="M209 375H791A340 340 0 0 1 209 375Z"/>
</svg>
