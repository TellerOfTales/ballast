<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ballast</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#0e1013">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="menu-btn" class="icon-btn" title="Menu" aria-label="Menu">☰</button>
  <div id="side-scrim"></div>
  <div id="app">
    <aside id="side">
      <div class="brand"><img src="logo.svg" alt="Ballast"></div>
      <section>
        <h4>Games <button class="icon-btn" id="new-game" title="New game">+</button></h4>
        <nav id="games"></nav>
      </section>
      <section class="grow">
        <h4>Accounts <button class="icon-btn" id="new-account" title="Add a Claude account">+</button></h4>
        <div id="accounts"></div>
      </section>
      <footer>
        <button class="ghost small" id="open-settings">Settings</button>
        <span id="conn" class="conn" title="Connection to Ballast"></span>
      </footer>
    </aside>
    <main id="main">
      <header id="ghead"></header>
      <nav id="tabs"></nav>
      <div id="view"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
